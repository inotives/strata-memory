profile: "coder"

index:
  backend: "sqlite"

semantic:
  provider: ""
  model: ""
  embedding_dim: 0

tags:
  allowed:
    - agent
    - memory
    - research
    - skill
    - workflow

rooms:
  1_draft:
    - path: "research"
      description: "Unverified research drafts awaiting review."
      depth: "recursive"
      allowed_status:
        - pending
    - path: "note"
      description: "Ad-hoc draft notes."
      depth: "recursive"
      allowed_status:
        - pending
    - path: "skill"
      description: "Draft skill material."
      depth: "recursive"
      allowed_status:
        - pending
    - path: "agent"
      description: "Draft agent persona material."
      depth: "recursive"
      allowed_status:
        - pending
    - path: "workflow"
      description: "Draft workflow material."
      depth: "recursive"
      allowed_status:
        - pending
    - path: "session"
      description: "Raw session captures."
      depth: "recursive"
      allowed_status:
        - pending
  2_knowledge:
    - path: "concept"
      description: "Foundational ideas, definitions, principles, patterns, frameworks."
      depth: "recursive"
      allowed_status:
        - verified
    - path: "entity/project/*"
      description: "Project-specific knowledge."
      depth: "recursive"
      required_files:
        - "_meta.md"
      allowed_status:
        - verified
    - path: "entity/tool/*"
      description: "Tool-specific knowledge."
      depth: "recursive"
      required_files:
        - "_meta.md"
      allowed_status:
        - verified
    - path: "entity/company/*"
      description: "Company-specific knowledge keyed by lowercase company paths."
      depth: "recursive"
      required_files:
        - "_meta.md"
      allowed_status:
        - verified
    - path: "entity/stock/*"
      description: "Stock-specific knowledge keyed by lowercase ticker paths."
      depth: "recursive"
      required_files:
        - "_meta.md"
      allowed_status:
        - verified
    - path: "entity/cryptocurrency/*"
      description: "Cryptocurrency-specific knowledge keyed by lowercase symbol paths."
      depth: "recursive"
      required_files:
        - "_meta.md"
      allowed_status:
        - verified
    - path: "research"
      description: "Reviewed research."
      depth: "recursive"
      allowed_status:
        - verified
    - path: "note"
      description: "Curated notes."
      depth: "recursive"
      allowed_status:
        - verified
    - path: "preference"
      description: "Stable user preferences."
      depth: "recursive"
      allowed_status:
        - verified
  3_intelligence:
    - path: "skill"
      description: "Reusable capability bundles."
      depth: "recursive"
      allowed_status:
        - verified
    - path: "agent"
      description: "Agent persona definitions."
      depth: "recursive"
      allowed_status:
        - verified
    - path: "workflow"
      description: "Operational workflows."
      depth: "recursive"
      allowed_status:
        - verified
    - path: "report"
      description: "Generated reports."
      depth: "recursive"
      allowed_status:
        - generated

profiles:
  coder:
    tier2_rooms:
      - "concept"
      - "entity/project/*"
      - "entity/tool/*"
      - "entity/company/*"
      - "research"
      - "note"
      - "preference"
  trader:
    tier2_rooms:
      - "concept"
      - "entity/company/*"
      - "entity/stock/*"
      - "entity/cryptocurrency/*"
      - "research"
      - "note"
      - "preference"
